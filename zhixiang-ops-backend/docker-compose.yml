# 智享运营系统 · 完整服务编排
# 包括: NestJS后端 + MySQL + Redis + Playwright浏览器工作台
#
# 服务说明:
#   - api: NestJS后端服务 (端口: 3000)
#   - mysql: 数据库服务 (端口: 3306)
#   - redis: 缓存服务 (端口: 6379)
#   - browser: Playwright浏览器工作台 (端口: 3001)
#
# 必要配置:
#   1. 复制 .env.example 为 .env 并填写真实凭据
#   2. 确保播放器依赖已安装: npx playwright install chromium
#
# 用法:
#   docker compose up -d            # 启动所有服务
#   docker compose ps               # 查看健康状态
#   docker compose down             # 停止并保留数据
#   docker compose down -v         # 停止并清空数据卷

services:
  # NestJS API 服务
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zhixiang-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_TYPE=mysql
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${DB_USER:-root}
      - MYSQL_PASSWORD=${DB_PASSWORD:-your_password}
      - MYSQL_DATABASE=${DB_NAME:-zhixiang_ops}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPS_BROWSER_EXECUTABLE=
      - OPS_BROWSER_HEADLESS=true
      - CORS_ORIGIN=http://localhost:3001
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ops-net

  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: ops-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-your_password}
      MYSQL_DATABASE: ${DB_NAME:-zhixiang_ops}
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - ops-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pyour_password"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ops-net

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: ops-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ops-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - ops-net

  # Playwright 浏览器工作台前端
  browser:
    build:
      context: ./src/modules/workspace
      dockerfile: Dockerfile.browser
    container_name: browser-workbench
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - VITE_WS_URL=http://api:3000
      - VITE_NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ops-net

networks:
  ops-net:
    driver: bridge

volumes:
  ops-mysql-data:
  ops-redis-data: